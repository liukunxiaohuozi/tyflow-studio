<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>TingYun Studio 项目配置与闭环演示</title>
<style>html,body{margin:0;background:#0b1525;overflow:hidden}canvas{display:block}</style><canvas id="c" width="1280" height="720"></canvas>
<script>
const fs=require('fs'),path=require('path');const c=document.getElementById('c'),g=c.getContext('2d');const W=1280,H=720,FPS=30;const params=new URLSearchParams(location.search),out=params.get('out'),lang=params.get('lang')||'zh';
const base=path.resolve(__dirname,'../artifacts/demo-frames');const files={config:'01-project-config.png',detail:'01b-project-config-detail.png',intake:'02-demo-intake.png',plan:'03-plan-ready.png',review:'05-run-review.png',accepted:'06-accepted.png'};const imgs={};
function load(){return Promise.all(Object.entries(files).map(([k,v])=>new Promise((r,j)=>{const i=new Image();i.onload=()=>{imgs[k]=i;r()};i.onerror=j;i.src='file:///'+path.join(base,v).replaceAll('\\','/')})))}
function rr(x,y,w,h,r,fill,stroke){g.beginPath();g.roundRect(x,y,w,h,r);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=2;g.stroke()}}
function txt(s,x,y,size=20,color='#fff',weight=500,align='left'){g.fillStyle=color;g.font=`${weight} ${size}px Microsoft YaHei,Arial`;g.textAlign=align;g.textBaseline='middle';g.fillText(s,x,y)}
function page(k,zoom=1,ox=0,oy=0){g.fillStyle='#dfe7f2';g.fillRect(0,0,W,H);g.save();g.translate(ox,oy);g.scale(zoom,zoom);g.drawImage(imgs[k],0,0,W,H);g.restore()}
function chapter(no,title,sub){rr(28,26,520,82,13,'rgba(10,24,44,.93)','#367cf5');rr(45,43,44,44,22,'#2472ee');txt(String(no),67,65,18,'#fff',700,'center');txt(title,106,55,24,'#fff',700);txt(sub,106,82,13,'#a9bed8',400)}
function callout(x,y,w,title,body){rr(x,y,w,74,10,'rgba(9,24,45,.93)','#3d7eea');txt(title,x+18,y+23,16,'#74adff',700);txt(body,x+18,y+50,13,'#e8f1ff',500)}
function pointer(x,y,pulse=true){if(pulse){g.beginPath();g.arc(x+4,y+4,24,0,Math.PI*2);g.strokeStyle='rgba(33,113,238,.8)';g.lineWidth=4;g.stroke()}g.beginPath();g.moveTo(x,y);g.lineTo(x,y+30);g.lineTo(x+8,y+22);g.lineTo(x+17,y+38);g.lineTo(x+25,y+34);g.lineTo(x+16,y+19);g.lineTo(x+31,y+19);g.closePath();g.fillStyle='#fff';g.fill();g.strokeStyle='#10213a';g.lineWidth=2;g.stroke()}
function selector(sel){g.fillStyle='rgba(22,35,55,.55)';g.fillRect(205,0,1075,H);rr(370,178,690,365,14,'#fff','#cbd6e6');txt('选择演示案例',410,222,25,'#17263c',700);txt('选择一种任务，体验从录入、执行到验收交付的完整闭环',410,256,14,'#60738e',400);choice(410,292,285,170,'Bug 修复','缺陷定位、代码修复、必要检查、启动验收','Bug',sel==='bug','#f05264');choice(735,292,285,170,'需求开发','需求评估、分支开发、自动测试、验收交付','需求',sel==='req','#2472ee');txt('演示过程使用模拟数据，不会修改真实项目',410,505,12,'#8292a8',400)}
function choice(x,y,w,h,title,sub,badge,active,color){rr(x,y,w,h,11,active?'#eef5ff':'#f8fafc',active?color:'#d8e1ee');rr(x+18,y+18,58,26,13,color);txt(badge,x+47,y+31,12,'#fff',700,'center');txt(title,x+18,y+76,21,'#17263c',700);txt(sub.slice(0,15),x+18,y+108,13,'#60738e',400);txt(sub.slice(15),x+18,y+130,13,'#60738e',400);rr(x+18,y+h-40,w-36,28,7,active?color:'#e8edf4');txt('开始演示',x+w/2,y+h-26,13,active?'#fff':'#5f7189',600,'center')}
function title(){g.fillStyle='#091525';g.fillRect(0,0,W,H);const q=g.createRadialGradient(640,300,20,640,300,600);q.addColorStop(0,'#174985');q.addColorStop(1,'#091525');g.fillStyle=q;g.fillRect(0,0,W,H);rr(594,130,92,92,20,'#2472ee');txt('↗',640,176,46,'#fff',700,'center');txt('TingYun Studio',640,284,30,'#79b1ff',700,'center');txt('项目配置与研发质量闭环演示',640,342,44,'#fff',700,'center');txt('项目接入 → Bug 修复 → 需求开发 → 验收交付',640,402,22,'#c1d1e6',500,'center');rr(510,464,260,44,22,'#1b65c9');txt('基于实际产品页面录制',640,486,16,'#fff',600,'center')}
function end(){g.fillStyle='#091525';g.fillRect(0,0,W,H);txt('✓',640,225,72,'#35c98f',700,'center');txt('一个项目配置 两种任务闭环',640,315,42,'#fff',700,'center');txt('计划可预览 · 过程可追溯 · 结果可验收',640,375,23,'#bdd0e8',500,'center');rr(500,445,280,50,25,'#2472ee');txt('TingYun Studio',640,470,19,'#fff',700,'center')}
function draw(t){if(t<3){title();return}if(t<10){page('config');chapter(1,'先完成项目配置','建立任务执行所需的项目上下文');callout(775,248,440,'开发者与默认项目','确定 Git 身份，并指定新任务默认归属项目');pointer(1180,338,t%1<.35);return}if(t<18){page('detail');chapter(1,'项目与 Git 仓库','一次配置，后续任务直接复用');callout(286,533,430,'项目定位','项目 ID、项目名称、仓库地址与本地目录');callout(735,533,470,'运行约定','认证方式、分支策略、启动脚本与开发页地址');return}if(t<22){page('config');chapter(2,'进入演示示例','从侧栏打开案例选择');pointer(82,569,t>20);return}if(t<26){page('config');selector(t<24?'bug':'req');chapter(2,'选择任务类型','Bug 修复与需求开发采用不同闭环');pointer(t<24?552:875,444,true);return}if(t<31){page('intake');chapter(3,'Bug 修复','选择 Bug 修复并补充复现信息');callout(700,130,495,'任务录入','选择项目、缺陷来源、复现步骤、截图与期望结果');callout(700,218,495,'直接修复','基于所选分支定位问题，完成必要检查后进入验收');return}if(t<37){page('review');chapter(3,'Bug 修复闭环','问题修复 → 必要检查 → 启动与验收');callout(716,603,475,'闭环证据','执行日志、检查结果、代码快照与验收结果保存在同一记录');return}if(t<42){page('intake');chapter(4,'需求开发','录入文字需求或导入 OpenDesign 设计');callout(690,130,505,'先评估再开发','生成开发计划、风险和测试用例，确认后再执行');return}if(t<47){page('plan');chapter(4,'确认执行范围','计划与测试用例均可预览和修订');callout(688,600,515,'质量前置','开发前锁定需求快照、分支、计划和验收标准');return}if(t<51){page('review');chapter(4,'需求开发闭环','需求评估 → 开发实现 → 自动测试 → 启动验收');callout(716,603,475,'人工验收','自动测试通过后仍需体验真实页面，确认后提交并推送');return}if(t<53){page('accepted');chapter(5,'交付完成','任务记录、测试结果和交付信息完整保留');return}end()}
function narratedScene(scene,t){
  const zh=lang==='zh';
  if(scene==='title'){title();return}
  if(scene==='config'){page(t%8<4?'config':'detail');chapter(1,zh?'项目配置':'Project setup',zh?'建立可执行的项目上下文':'Create an executable project context');callout(748,220,460,zh?'配置输入':'Configuration inputs',zh?'身份、仓库、目录、分支、脚本与目标地址':'Identity, repository, branch, command, and URL');return}
  if(scene==='recognition'){page('intake');chapter(2,zh?'需求识别与统一输入':'Requirement recognition',zh?'设计、文字、Bug、禅道与附件':'Design, text, bugs, ZenTao, and evidence');callout(690,124,510,zh?'三类任务来源':'Three task sources',zh?'识别页面资源并汇总为统一需求输入':'Normalize pages, assets, and task evidence');return}
  if(scene==='assessment'){page('intake');chapter(3,zh?'只读评估':'Read-only assessment',zh?'检查需求、仓库、分支与项目规范':'Inspect requirement, repository, branch, and standards');callout(676,530,530,zh?'不修改代码':'No code changes',zh?'发现脏工作区、落后分支和阻塞风险':'Detect dirty worktrees, stale branches, and blockers');return}
  if(scene==='plan'){page('plan');chapter(4,zh?'计划与测试用例':'Plan and test cases',zh?'可预览、可修改、可重新生成':'Review, revise, and regenerate');callout(682,548,520,zh?'评估产出':'Assessment outputs',zh?'实现步骤、风险、阻塞项、测试步骤与预期结果':'Steps, risks, blockers, test actions, and expected results');return}
  if(scene==='snapshot'){page('plan');chapter(5,zh?'锁定执行快照':'Freeze execution snapshot',zh?'防止执行范围被静默改变':'Prevent silent scope changes');callout(682,548,520,zh?'快照内容':'Snapshot contents',zh?'需求、分支、基线提交、计划、用例与附件哈希':'Requirement, branch, base commit, plan, cases, and hashes');return}
  if(scene==='development'){page('review');chapter(6,zh?'按计划开发':'Plan-driven development',zh?'分支、代码改动、日志和提交全程记录':'Track branch, changes, logs, and commits');callout(704,540,492,zh?'差异可审查':'Reviewable changes',zh?'计划外文件会在门禁中被明确标记':'Unplanned files are flagged by the quality gate');return}
  if(scene==='testing'){page('review');chapter(7,zh?'测试 Skill 自动介入':'Testing skill intervention',zh?'用例、硬检查、单测、集成与页面验证':'Cases, hard checks, unit, integration, and UI validation');callout(704,540,492,zh?'逐项记录结果':'Per-check results',zh?'每项检查包含状态、详情与原始失败日志':'Each check stores status, details, and failure logs');return}
  if(scene==='evidence'){page('review');chapter(8,zh?'用证据证明测试可信':'Evidence-backed testing',zh?'代码快照、计划哈希、执行身份与差异审查':'Source snapshot, plan hash, executor, and diff review');callout(704,540,492,zh?'质量门禁':'Quality gates',zh?'改动、计划外、未覆盖和高风险文件全部可查':'Changed, unplanned, uncovered, and risky files are visible');return}
  if(scene==='failure'){page('review');chapter(9,zh?'失败不是完成':'Failure is not completion',zh?'保留现场，补充证据，修复并重测':'Preserve evidence, add context, repair, and retest');callout(704,540,492,zh?'闭环重试':'Closed-loop retry',zh?'从失败阶段继续，直到检查与门禁重新通过':'Resume from failure until checks and gates pass');return}
  if(scene==='acceptance'){page('review');chapter(10,zh?'真实页面人工验收':'Manual acceptance on the real page',zh?'自动化通过后仍需业务确认':'Business confirmation still follows automation');callout(704,540,492,zh?'启动与体验':'Launch and review',zh?'运行启动脚本、打开目标地址、验证真实交互':'Run the start command, open the target URL, and validate UX');return}
  if(scene==='delivery'){page('accepted');chapter(11,zh?'提交、推送与归档':'Commit, push, and archive',zh?'从最终代码反查完整证据链':'Trace final code back to the full evidence chain');callout(704,540,492,zh?'交付记录':'Delivery record',zh?'提交号、分支、远程、时间、测试和需求快照':'Commit, branch, remote, time, tests, and snapshot');return}
  if(scene==='bug'){page(t%8<4?'intake':'review');chapter(12,zh?'Bug 修复快捷闭环':'Shorter bug-fix loop',zh?'路径更短，但证据标准不降低':'Shorter path, same evidence standard');return}
  end()
}
function subtitle(text){const max=lang==='zh'?30:58,words=lang==='zh'?[...text]:text.split(' '),lines=[];let line='';for(const word of words){const next=lang==='zh'?line+word:(line?line+' ':'')+word;if(next.length>max){lines.push(line);line=word}else line=next}if(line)lines.push(line);const shown=lines.slice(0,3);const h=shown.length*28+28;rr(105,H-h-18,W-210,h,10,'rgba(5,14,28,.9)','rgba(255,255,255,.2)');shown.forEach((v,i)=>txt(v,W/2,H-h+i*28,lang==='zh'?20:17,'#fff',600,'center'))}
async function run(){await load();const all=JSON.parse(fs.readFileSync(path.join(base,'../narration/timeline.json'),'utf8').replace(/^\uFEFF/,'')),cues=all.filter(v=>v.lang===lang);let cursor=.8;for(const cue of cues){cue.start=cursor;cue.end=cursor+cue.duration;cursor=cue.end+.65}const duration=cursor+.8;const ac=new AudioContext(),dest=ac.createMediaStreamDestination();for(const cue of cues){const bytes=fs.readFileSync(path.join(base,'../narration',cue.file));const audio=await ac.decodeAudioData(bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength));const src=ac.createBufferSource();src.buffer=audio;src.connect(dest);src.start(ac.currentTime+cue.start)}const video=c.captureStream(FPS),stream=new MediaStream([...video.getVideoTracks(),...dest.stream.getAudioTracks()]),mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus':'video/webm';const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6500000,audioBitsPerSecond:128000}),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=async()=>{const b=Buffer.from(await new Blob(chunks,{type:mime}).arrayBuffer());fs.mkdirSync(path.dirname(out),{recursive:true});fs.writeFileSync(out,b);document.title='VIDEO_DONE';console.log('VIDEO_DONE '+lang+' '+out+' '+b.length)};rec.start(1000);const s=performance.now();function f(n){const t=(n-s)/1000,current=cues.find(v=>t>=v.start&&t<v.end)||cues[Math.min(cues.length-1,cues.findIndex(v=>t<v.start))]||cues[0];narratedScene(current.scene,t);if(t>=current.start&&t<current.end)subtitle(current.text);t<duration?requestAnimationFrame(f):rec.stop()}requestAnimationFrame(f)}run();
</script></html>
