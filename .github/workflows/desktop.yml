name: Desktop builds
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm run lint
      - if: runner.os == 'Windows'
        run: npm test
      - if: runner.os == 'macOS'
        name: Run platform-independent tests
        run: npx jest tests/core.test.ts tests/theme.test.ts tests/bundle.test.ts tests/zentao.test.ts tests/vault.test.ts --runInBand
      - run: npm run scan
      - name: Ensure portable skill bundle
        run: |
          if [ ! -f portable-bundle/tyflow/shared/WORKFLOW.md ] || [ ! -f portable-bundle/skills/frontend-test/SKILL.md ]; then
            echo "Missing portable-bundle/. Run 'npm run pack:portable:seed' locally and commit portable-bundle/."
            exit 1
          fi
        shell: bash
      - if: runner.os == 'Windows'
        run: npm run pack:portable:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-windows.ps1 -Executable './release/win-unpacked/TingYun Studio.exe' -Packaged
      - if: runner.os == 'macOS'
        run: npm run pack:portable:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: TingYun-Studio-portable-${{ runner.os }}
          path: |
            release/*-portable.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows and macOS packages
        uses: actions/download-artifact@v4
        with:
          pattern: TingYun-Studio-portable-*
          path: release-artifacts
          merge-multiple: true
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "TingYun Studio $GITHUB_REF_NAME" \
            --notes "Windows x64 and macOS portable builds for $GITHUB_REF_NAME."
      - name: Upload packages with retries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          packages=(release-artifacts/*-portable.zip)
          if [ "${#packages[@]}" -ne 3 ]; then
            echo "Expected 3 portable packages, found ${#packages[@]}: ${packages[*]}"
            exit 1
          fi

          for package in "${packages[@]}"; do
            uploaded=false
            for attempt in 1 2 3; do
              echo "Uploading $(basename "$package") (attempt $attempt/3)"
              if gh release upload "$GITHUB_REF_NAME" "$package" --clobber; then
                uploaded=true
                break
              fi
              sleep $((attempt * 10))
            done
            if [ "$uploaded" != true ]; then
              echo "Failed to upload $(basename "$package") after 3 attempts."
              exit 1
            fi
          done
      - name: Verify published packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          packages=(release-artifacts/*-portable.zip)
          published="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .assets[].name")"
          for package in "${packages[@]}"; do
            name="$(basename "$package")"
            if ! grep -Fqx "$name" <<<"$published"; then
              echo "Release is missing package: $name"
              exit 1
            fi
          done
      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
